# 最初に置くのは 80 番だけの設定。証明書を取ったあと、certbot が 443 番の設定と HTTPS への転送を書き足す。
# funmary.example.com は、自分のドメインに書き換える。
server {
    listen 80;
    listen [::]:80;
    server_name funmary.example.com;

    # 画面の HTML は nginx の既定で圧縮される。ICS、フィード、JSON も圧縮する
    gzip on;
    gzip_types text/calendar application/rss+xml application/atom+xml
               application/feed+json application/json image/svg+xml;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:28461;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
