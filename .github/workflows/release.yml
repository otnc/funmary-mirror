name: Release

# main の CI が成功したら、その変更をリリースにして GitHub Releases に置く (設計書 20.9)。
# CI が落ちた変更は、リリースも反映もされない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: リリースの作成
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: tar.gz とチェックサムを作る
        run: |
          version="build-${HEAD_SHA:0:7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          pnpm package-release "$version"
      - name: GitHub Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同じ版を作り直したときは、置き換える
          gh release delete "$VERSION" --cleanup-tag --yes || true
          gh release create "$VERSION" \
            --target "$HEAD_SHA" \
            --title "$VERSION" \
            --notes "main の $HEAD_SHA から自動で作ったリリースです。" \
            --prerelease \
            "release/funmary-$VERSION.tar.gz" \
            "release/funmary-$VERSION.tar.gz.sha256" \
            release/build-hash.txt \
            release/THIRD_PARTY_LICENSES.txt
      - name: 古い自動リリースを消す
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '10'
        run: |
          # build- で始まる自動のリリースだけを対象にし、新しいものから KEEP 個を残す。v で始まる正式なリリースには触れない
          gh release list --limit 200 --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"build-\"))) | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
