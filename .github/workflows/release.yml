name: Release

# main の CI が成功したら、その変更をリリースにして GitHub Releases に置く (設計書 20.9)。
# CI が落ちた変更は、リリースも反映もされない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: リリースの作成
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: tar.gz を作り、GitHub Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflows/release/publish-release.ts
      - name: 古い自動リリースを消す
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '10'
        run: node scripts/workflows/release/prune-releases.ts
