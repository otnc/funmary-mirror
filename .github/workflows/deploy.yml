name: Deploy

# リリースができたら、SSH で VPS に反映を頼む (設計書 20.9)。
# VPS では funmary-update が版の名前を確かめ、update.sh が取得から切り戻しまでを行う。
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# 同時に動く反映は 1 つだけ。実行中のものは取り消さず、次を待たせる
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS への反映
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: false
      - name: VPS に反映を頼む
        run: node scripts/workflows/deploy/request-deploy.ts
